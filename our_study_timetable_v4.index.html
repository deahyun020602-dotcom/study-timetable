<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f8fc"><title>우리의 공부시간표</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#202638;--muted:#7c8497;--line:#e9ebf2;--blue:#7198d0;--bluebg:#eaf1fc;--pink:#d88ba6;--pinkbg:#fbeef3;--green:#7da994;--shadow:0 8px 28px #29375a0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1120px;margin:auto;padding:24px 22px 44px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--muted);font-weight:800}.title{font-size:25px;font-weight:850;margin:5px 0}.sub{color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px}.btn{padding:10px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:700}.btn.primary{background:#344c73;color:white;border-color:#344c73}.btn:active{transform:scale(.98)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}.stat{padding:16px 18px;text-align:left;width:100%;font:inherit}.summary-card{cursor:pointer;transition:border-color .15s,box-shadow .15s}.summary-card[aria-pressed="true"]{border-color:#7198d0;box-shadow:0 0 0 2px #7198d044, var(--shadow);background:#f3f7fd}.stat-label{font-size:12px;color:var(--muted);font-weight:700}.stat-value{font-size:23px;font-weight:850;margin-top:7px}.stat-value.blue{color:#527cb8}.stat-value.pink{color:#bb6888}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,.85fr);gap:16px}.panel{padding:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.month{font-size:18px;font-weight:850}.nav{display:flex;gap:5px}.nav button{background:#f4f5f9;border-radius:9px;width:32px;height:32px;font-size:17px}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.week div{text-align:center;font-size:11px;color:var(--muted);padding:7px 0;font-weight:800}.day{border:1px solid transparent;background:#fafbfe;border-radius:11px;min-height:78px;padding:8px 6px;text-align:left;position:relative;overflow:hidden}.day.out{opacity:.35}.day.selected{border-color:#7198d0;background:#f0f5fd}.day.today .num{background:#344c73;color:#fff;border-radius:50%;width:23px;height:23px;display:inline-flex;align-items:center;justify-content:center}.num{font-size:12px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;width:23px;height:23px}.dots{display:flex;gap:3px;margin:7px 0 4px}.dot{width:6px;height:6px;border-radius:50%}.mini{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;color:#697187}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:12px}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}.side-title{font-weight:850;font-size:16px}.date-label{font-size:12px;color:var(--muted);margin-top:3px}.tabs{display:flex;background:#f3f4f8;padding:4px;border-radius:11px;gap:3px;margin:13px 0}.tab{flex:1;padding:8px 4px;border-radius:8px;background:transparent;color:var(--muted);font-size:12px;font-weight:750}.tab.active{background:#fff;color:var(--ink);box-shadow:0 2px 6px #18213a10}.events{display:flex;flex-direction:column;gap:8px;max-height:420px;overflow:auto}.event{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:10px 11px;display:flex;justify-content:space-between;gap:8px}.event.pink{border-left-color:var(--pink)}.event.green{border-left-color:var(--green)}.event-title{font-weight:800;font-size:13px}.event-meta{font-size:11px;color:var(--muted);margin-top:5px}.event-actions{display:flex;gap:4px;align-items:flex-start}.iconbtn{background:#f5f6fa;border-radius:7px;padding:5px 7px;color:#626b7e;font-size:11px}.empty{padding:25px 8px;text-align:center;color:var(--muted);font-size:13px}.side-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:14px;padding-top:13px;font-size:12px;color:var(--muted)}.total{font-weight:850;color:var(--ink);font-size:15px}.notice{font-size:11px;color:var(--muted);line-height:1.55;margin-top:14px;padding:11px;background:#f7f8fb;border-radius:10px}.modal-back{position:fixed;inset:0;background:#18223866;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal-back.show{display:flex}.modal{background:#fff;border-radius:20px;padding:22px;width:min(440px,100%);box-shadow:0 20px 80px #17213b30}.modal h2{font-size:19px;margin:0 0 16px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:800;color:#596276}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fbfcfe;color:var(--ink);outline:none}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.color-options{display:flex;gap:9px}.color-options label{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600}.color-options input{width:auto}.footer{text-align:center;color:#9aa1b1;font-size:11px;margin-top:18px}
@media(max-width:760px){.app{padding:17px 12px 30px}.top{align-items:flex-start}.title{font-size:21px}.top-actions{flex-direction:column}.top-actions .btn{padding:9px 10px;font-size:12px}.stats{gap:7px}.stat{padding:12px 10px;border-radius:14px}.stat-value{font-size:18px}.stat-label{font-size:10px}.layout{grid-template-columns:1fr}.panel{padding:14px}.day{min-height:64px;padding:5px 3px;border-radius:8px}.week,.calendar{gap:3px}.mini{display:none}.dots{margin-top:9px}.calendar-panel{padding:13px 9px}.side-panel{padding:16px}.events{max-height:none}}
</style>
</head>
<body>
<div class="app">
 <header class="top"><div><div class="eyebrow">COUPLE STUDY PLANNER</div><div class="title">우리의 공부시간표 <span style="font-size:18px">♡</span></div><div class="sub">각자의 계획도, 함께하는 일정도 한곳에서</div></div><div class="top-actions"><button class="btn" id="todayBtn">오늘로</button><button class="btn primary" id="addBtn">＋ 일정 추가</button></div></header>
 <section class="stats">
  <button class="stat summary-card" id="allCard" type="button" aria-pressed="true"><div class="stat-label">오늘 전체 계획</div><div class="stat-value" id="allHours">0시간</div></button>
  <button class="stat summary-card" id="meCard" type="button" aria-pressed="false"><div class="stat-label">대현</div><div class="stat-value blue" id="meHours">0시간</div></button>
  <button class="stat summary-card" id="partnerCard" type="button" aria-pressed="false"><div class="stat-label">여자친구</div><div class="stat-value pink" id="partnerHours">0시간</div></button>
 </section>
 <div class="layout">
  <section class="panel calendar-panel"><div class="panel-head"><div class="month" id="monthLabel"></div><div class="nav"><button id="prev">‹</button><button id="next">›</button></div></div><div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="calendar" id="calendar"></div><div class="legend"><span><i style="background:#7198d0"></i>대현</span><span><i style="background:#d88ba6"></i>여자친구</span><span><i style="background:#7da994"></i>공동 일정</span></div></section>
  <section class="panel side-panel"><div class="panel-head"><div><div class="side-title" id="scheduleHeading">전체 일정 · 선택한 날짜</div><div class="date-label" id="selectedLabel"></div></div><button class="btn" id="addDayBtn" style="padding:8px 10px;font-size:12px">＋ 추가</button></div><div class="tabs"><button class="tab active" data-filter="all">전체</button><button class="tab" data-filter="me">대현</button><button class="tab" data-filter="partner">여자친구</button><button class="tab" data-filter="shared">공동</button></div><div class="events" id="events"></div><div class="notice">현재 버전은 이 기기 안에 일정이 저장되는 미리보기입니다. 두 사람의 기기 간 실시간 공유와 초대 코드는 다음 단계에서 온라인 연결을 설정해야 작동합니다.</div></section>
 </div><div class="footer">우리의 공부시간표 · 첫 번째 프로토타입</div>
</div>
<div class="modal-back" id="modalBack"><form class="modal" id="eventForm"><h2 id="modalTitle">일정 추가</h2><input type="hidden" id="eventId"><div class="field"><label>일정 이름</label><input id="eventName" required placeholder="예: 재무회계 인강"></div><div class="row2"><div class="field"><label>날짜</label><input type="date" id="eventDate" required></div><div class="field"><label>구분</label><select id="eventOwner"><option value="me">대현 개인</option><option value="partner">여자친구 개인</option><option value="shared">공동 일정</option></select></div></div><div class="row2"><div class="field"><label>시작</label><input type="time" id="eventStart" value="09:00" required></div><div class="field"><label>종료</label><input type="time" id="eventEnd" value="10:00" required></div></div><div class="field"><label>메모 (선택)</label><input id="eventMemo" placeholder="장소나 공부 내용 등"></div><div class="modal-actions"><button type="button" class="btn" id="cancelBtn">취소</button><button type="submit" class="btn primary">저장</button></div></form></div>
<script>
const $=id=>document.getElementById(id);let now=new Date(),view=new Date(now.getFullYear(),now.getMonth(),1),selected=fmt(now),filter='all';
let events=[];try{events=JSON.parse(localStorage.getItem('coupleStudyEvents')||'[]')}catch(e){}
const fmt=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const mins=e=>{let [a,b]=[e.start,e.end].map(t=>{let [h,m]=t.split(':').map(Number);return h*60+m});return Math.max(0,b-a)};
const duration=n=>{let h=Math.floor(n/60),m=n%60;return h?(m?`${h}시간 ${m}분`:`${h}시간`):`${m}분`};
const ownerColor=o=>o==='me'?'#7198d0':o==='partner'?'#d88ba6':'#7da994';
const ownerName=o=>o==='me'?'대현':o==='partner'?'여자친구':'공동';
function save(){localStorage.setItem('coupleStudyEvents',JSON.stringify(events))}
function render(){
 $('monthLabel').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`+(filter==='me'?' · 대현 시간표':filter==='partner'?' · 여자친구 시간표':filter==='shared'?' · 공동 일정':' · 전체 시간표');
 let first=new Date(view.getFullYear(),view.getMonth(),1),start=new Date(first);start.setDate(1-first.getDay());
 let html='';for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let ds=fmt(d),items=events.filter(e=>e.date===ds).filter(e=>filter==='all'||(filter==='shared'?e.owner==='shared':e.owner===filter)),out=d.getMonth()!==view.getMonth(),isToday=ds===fmt(now);
 html+=`<button class="day ${out?'out':''} ${selected===ds?'selected':''} ${isToday?'today':''}" data-date="${ds}"><span class="num">${d.getDate()}</span><div class="dots">${items.slice(0,4).map(e=>`<i class="dot" style="background:${ownerColor(e.owner)}"></i>`).join('')}</div>${items.slice(0,1).map(e=>`<div class="mini">${esc(e.name)}</div>`).join('')}</button>`}
 $('calendar').innerHTML=html;
 document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{selected=b.dataset.date;render()});
 $('selectedLabel').textContent=new Date(selected+'T12:00:00').toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
 $('scheduleHeading').textContent=(filter==='me'?'대현 시간표':filter==='partner'?'여자친구 시간표':filter==='shared'?'공동 일정':'전체 일정')+' · 선택한 날짜';
 let dayEvents=events.filter(e=>e.date===selected),visible=dayEvents.filter(e=>filter==='all'||e.owner===filter);
 $('events').innerHTML=visible.length?visible.sort((a,b)=>a.start.localeCompare(b.start)).map(e=>`<div class="event ${e.owner==='partner'?'pink':e.owner==='shared'?'green':''}" style="border-left-color:${ownerColor(e.owner)}"><div><div class="event-title">${esc(e.name)}</div><div class="event-meta">${e.start}–${e.end} · ${ownerName(e.owner)} · ${duration(mins(e))}${e.memo?' · '+esc(e.memo):''}</div></div><div class="event-actions"><button class="iconbtn" data-edit="${e.id}">수정</button><button class="iconbtn" data-del="${e.id}">삭제</button></div></div>`).join(''):'<div class="empty">등록된 일정이 없어요.<br>＋ 일정을 추가해 보세요.</div>';
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openModal(events.find(e=>e.id===b.dataset.edit)));
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('이 일정을 삭제할까요?')){events=events.filter(e=>e.id!==b.dataset.del);save();render()}});
 let total=dayEvents.reduce((s,e)=>s+mins(e),0);
 let todayEvents=events.filter(e=>e.date===fmt(now));let sums={me:0,partner:0,shared:0};todayEvents.forEach(e=>sums[e.owner]+=mins(e));
 $('meHours').textContent=duration(sums.me);$('partnerHours').textContent=duration(sums.partner);$('allHours').textContent=duration(sums.me+sums.partner+sums.shared);
 $('meCard').style.display='block';
 $('partnerCard').style.display='block';
 $('allCard').setAttribute('aria-pressed',String(filter==='all'||filter==='shared'));
 $('meCard').setAttribute('aria-pressed',String(filter==='me'));
 $('partnerCard').setAttribute('aria-pressed',String(filter==='partner'));
}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openModal(e){$('eventForm').reset();$('eventId').value=e?.id||'';$('modalTitle').textContent=e?'일정 수정':'일정 추가';$('eventName').value=e?.name||'';$('eventDate').value=e?.date||selected;$('eventOwner').value=e?.owner||'me';$('eventStart').value=e?.start||'09:00';$('eventEnd').value=e?.end||'10:00';$('eventMemo').value=e?.memo||'';$('modalBack').classList.add('show')}
function closeModal(){$('modalBack').classList.remove('show')}
$('eventForm').onsubmit=ev=>{ev.preventDefault();let start=$('eventStart').value,end=$('eventEnd').value;if(end<=start){alert('종료 시간은 시작 시간보다 늦어야 해요.');return}let id=$('eventId').value;let item={id:id||String(Date.now()),name:$('eventName').value.trim(),date:$('eventDate').value,owner:$('eventOwner').value,start,end,memo:$('eventMemo').value.trim()};if(id)events=events.map(e=>e.id===id?item:e);else events.push(item);selected=item.date;view=new Date(item.date+'T12:00:00');view.setDate(1);save();closeModal();render()};
$('addBtn').onclick=$('addDayBtn').onclick=()=>openModal();$('cancelBtn').onclick=closeModal;$('modalBack').onclick=e=>{if(e.target===$('modalBack'))closeModal()};
$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);render()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);render()};$('todayBtn').onclick=()=>{selected=fmt(now);view=new Date(now.getFullYear(),now.getMonth(),1);render()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{setFilter(b.dataset.filter)});
$('allCard').onclick=()=>setFilter('all');$('meCard').onclick=()=>setFilter('me');$('partnerCard').onclick=()=>setFilter('partner');
function setFilter(value){
 filter=value;
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.filter===value));
 render();
 const heading=$('scheduleHeading');
 heading.textContent=(value==='me'?'대현 시간표':value==='partner'?'여자친구 시간표':value==='shared'?'공동 일정':'전체 일정')+' · 선택한 날짜';
 // The selected person's calendar and event list are now shown as a distinct view.
 $('monthLabel').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`+(value==='me'?' · 대현 시간표':value==='partner'?' · 여자친구 시간표':value==='shared'?' · 공동 일정':' · 전체 시간표');
 $('scheduleHeading').textContent=(value==='me'?'대현 개인 시간표':value==='partner'?'여자친구 개인 시간표':value==='shared'?'공동 일정':'전체 시간표')+' · 선택한 날짜';
}
render();
</script>
</body></html>
